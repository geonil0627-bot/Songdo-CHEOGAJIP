<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>처갓집양념치킨 매장 안내</title>
    <style>
        /* 기본 리셋 및 스타일 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        /* 브랜드 헤더 */
        .brand-header {
            background-color: #c51e25; /* 처갓집 레드 */
            padding: 30px 20px 20px;
            text-align: center;
            color: #ffffff;
        }

        .brand-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .brand-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .brand-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* 매장 목록 스타일 */
        .store-section {
            padding: 20px;
        }

        .store-list {
            list-style: none;
        }

        .store-item {
            background-color: #ffffff;
            border: 1px solid #edf2f7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        /* 지점명 + 쿠폰 배지 정렬 (양끝 정렬) */
        .store-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .store-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #1a202c;
        }

        /* 🎟️ 쿠폰 모양 버튼 스타일 */
        .coupon-badge {
            display: inline-flex;
            align-items: center;
            background-color: #e53e3e;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(229, 62, 62, 0.25);
            transition: transform 0.15s ease, background-color 0.15s ease;
            white-space: nowrap;
        }

        .coupon-badge:hover {
            background-color: #c53030;
            transform: translateY(-1px);
        }

        /* 하단 쿠폰 입력 안내 문구 스타일 */
        .coupon-info {
            font-size: 0.82rem;
            color: #e53e3e;
            background-color: #fff5f5;
            padding: 6px 10px;
            border-radius: 6px;
            margin-top: 6px;
            display: block;
            border-left: 3px solid #e53e3e;
        }

        .coupon-info strong {
            color: #c53030;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 브랜드 헤더 (GitHub 이미지 연동 완료) -->
        <header class="brand-header">
            <img src="https://cdn.jsdelivr.net/gh/geonil0627-bot/logo@main/logo.png" alt="처갓집양념치킨 로고" class="brand-logo">
            <span class="brand-badge">CHEOGAJIP OFFICIAL</span>
            <h1>처갓집양념치킨 송도지점</h1>
            <p>매장 안내 및 할인 혜택</p>
        </header>

        <!-- 매장 목록 세션 -->
        <main class="store-section">
            <ul class="store-list">

                <!-- 1. 송도센트럴점 -->
                <li class="store-item">
                    <div class="store-header">
                        <span class="store-name">송도센트럴점</span>
                        
                        <!-- 쿠폰 버튼 (어플 설치 링크) -->
                        <a href="https://app.cheogajip.co.kr/Z8EHpid=nambu&c=store&af_adset=in2&af_ad=a0027&is_retargeting=true" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="coupon-badge">
                            🎟️ 7,000원 할인
                        </a>
                    </div>
                    
                    <!-- 하단 안내 문구 -->
                    <p class="coupon-info">
                        '<strong>송도센트럴</strong>' 쿠폰입력 시 7,000원 할인쿠폰 증정
                    </p>
                </li>

                <!-- 2. 송도레이크점 -->
                <li class="store-item">
                    <div class="store-header">
                        <span class="store-name">송도레이크점</span>
                        
                        <!-- 쿠폰 버튼 (어플 설치 링크) -->
                        <a href="https://app.cheogajip.co.kr/Z8EHpid=nambu&c=store&af_adset=in2&af_ad=a0027&is_retargeting=true" 
                           target="_blank" 
                           rel="noopener noreferrer" 
                           class="coupon-badge">
                            🎟️ 7,000원 할인
                        </a>
                    </div>
                    
                    <!-- 하단 안내 문구 -->
                    <p class="coupon-info">
                        '<strong>송도레이크</strong>' 쿠폰입력 시 7,000원 할인쿠폰 증정
                    </p>
                </li>

            </ul>
        </main>
    </div>

</body>
</html>
